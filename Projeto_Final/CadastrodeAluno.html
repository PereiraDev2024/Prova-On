<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- InputMask CSS (para CPF) -->
  <link href="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.css" rel="stylesheet">

  <!-- Favicon -->
  <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- InputMask JS -->
  <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
</head>

<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="row w-100">
      <div class="offset-md-3 col-md-6">
        <div class="card shadow-lg">
          <div class="card-body p-4">

            <!-- Imagem no centro -->
            <div class="text-center mb-4">
              <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" class="d-block mx-auto" width="50%" height="auto">
            </div>

            <h3 class="text-center mb-4">Cadastro de Aluno</h3>

            <form id="cadastroAlunoForm">
              <!-- Campo Nome -->
              <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" placeholder="Nome do Aluno" required>
              </div>

              <!-- Campo E-mail -->
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@dominio.com" required>
              </div>

              <!-- Campo Senha -->
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="********" required>
              </div>

              <!-- Campo Confirmar Senha -->
              <div class="mb-3">
                <label for="confirmaSenha" class="form-label">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmaSenha" placeholder="********" required>
              </div>

              <!-- Botões -->
              <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Cadastrar</button>
                <button type="reset" class="btn btn-outline-secondary">Limpar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (para utilizar componentes como modais, popovers, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    // Manipulação do formulário
    document.getElementById("cadastroAlunoForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const confirmaSenha = document.getElementById("confirmaSenha").value;

      // Validação de campos
      if (!nome || !email || !senha || !confirmaSenha) {
        alert("Preencha todos os campos.");
        return;
      }

      if (senha !== confirmaSenha) {
        alert("As senhas não coincidem.");
        return;
      }

      // Enviando a requisição para a API com Axios
      try {
        const response = await axios.post("https://sua-api.com/cadastro", {
          nome,
          email,
          senha
        });

        // Verificando a resposta da API
        if (response.data.success) {
          alert("Cadastro realizado com sucesso!");
          // Redirecionando ou executando ações após o cadastro bem-sucedido
        } else {
          alert("Erro ao cadastrar aluno.");
        }
      } catch (error) {
        console.error("Erro na requisição:", error);
        alert("Ocorreu um erro ao tentar realizar o cadastro.");
      }
    });
  </script>
</body>
</html>
