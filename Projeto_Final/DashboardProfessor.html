<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard do Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2>Dashboard do Professor</h2>

  <!-- ID do Professor -->
  <div class="mb-4">
    <label for="professorId" class="form-label">ID do Professor:</label>
    <input type="number" id="professorId" class="form-control" placeholder="Digite o ID do professor">
    <button class="btn btn-primary mt-2" onclick="buscarProvasDoProfessor()">Buscar Provas</button>
  </div>

  <!-- Lista de Provas -->
  <div class="card">
    <div class="card-header">
      <h5>Provas Aplicadas</h5>
    </div>
    <ul class="list-group list-group-flush" id="listaProvas">
      <!-- Provas vão aqui -->
    </ul>
  </div>

  <!-- Alunos e pontuações da prova -->
  <div class="mt-5" id="alunosContainer" style="display:none;">
    <h4>Resultados da prova: <span id="tituloProvaSelecionada"></span></h4>
    <table class="table table-bordered table-sm mt-3" id="tabelaAlunos">
      <thead class="table-light">
        <tr>
          <th>Aluno</th>
          <th class="text-end">Pontuação</th>
        </tr>
      </thead>
      <tbody id="corpoTabelaAlunos"></tbody>
    </table>
    <div id="semResultados" class="alert alert-info" style="display:none;">
      Nenhum aluno realizou esta prova ainda.
    </div>
  </div>
</div>

<!-- Modal para editar prova -->
<div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editarForm">
        <div class="modal-header">
          <h5 class="modal-title">Editar Prova</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId" />
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" id="editTitulo" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Data/Hora Início</label>
            <input type="datetime-local" id="editInicio" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Data/Hora Fim</label>
            <input type="datetime-local" id="editFim" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Código</label>
            <input type="text" id="editCodigo" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Salvar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const API_BASE_URL = "http://localhost:5150";

  async function buscarProvasDoProfessor() {
    const idProfessor = document.getElementById("professorId").value;
    if (!idProfessor) return alert("Informe o ID do professor.");

    try {
      const response = await axios.get(`${API_BASE_URL}/Prova/ListarProvasProfessor/${idProfessor}`);
      renderizarProvas(response.data);
    } catch (error) {
      console.error(error);
      alert("Erro ao buscar provas.");
    }
  }

  function renderizarProvas(provas) {
    const lista = document.getElementById("listaProvas");
    lista.innerHTML = "";

    if (!provas || provas.length === 0) {
      lista.innerHTML = '<li class="list-group-item text-muted">Nenhuma prova encontrada.</li>';
      return;
    }

    provas.forEach(prova => {
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";
      li.innerHTML = `
        <div>
          <strong>${prova.titulo}</strong><br>
          Código: ${prova.codigo} | Cadastro: ${new Date(prova.dataHoraRegistro).toLocaleString()}
        </div>
        <div>
          <button class="btn btn-sm btn-info" onclick="verPontuacoes(${prova.id}, '${prova.titulo}')">Resultados</button>
          <button class="btn btn-sm btn-warning" onclick="abrirModalEditar(${prova.id})">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="removerProva(${prova.id})">Apagar</button>
        </div>
      `;
      lista.appendChild(li);
    });
  }

  async function verPontuacoes(provaId, titulo) {
    document.getElementById("alunosContainer").style.display = "block";
    document.getElementById("tituloProvaSelecionada").textContent = titulo;
    const tbody = document.getElementById("corpoTabelaAlunos");
    const semResultados = document.getElementById("semResultados");
    tbody.innerHTML = '<tr><td colspan="2" class="text-center">Carregando...</td></tr>';
    semResultados.style.display = "none";

    try {
      const response = await axios.get(`${API_BASE_URL}/AlunoRespostaObjetiva/ListarPontuacoesProva/${provaId}`);
      const pontuacoes = response.data;

      tbody.innerHTML = "";
      if (!pontuacoes || pontuacoes.length === 0) {
        tbody.innerHTML = "";
        semResultados.style.display = "block";
        return;
      }

      pontuacoes.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.aluno}</td>
          <td class="text-end"><strong>${parseFloat(p.pontuacaoFinal).toFixed(2)}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    } catch (error) {
      tbody.innerHTML = '<tr><td colspan="2" class="text-danger text-center">Erro ao buscar resultados.</td></tr>';
      console.error(error);
    }
  }

  async function abrirModalEditar(id) {
    try {
      const response = await axios.get(`${API_BASE_URL}/Prova/BuscarProva?Id=${id}`);
      const prova = response.data;

      document.getElementById("editId").value = prova.id;
      document.getElementById("editTitulo").value = prova.titulo;
      document.getElementById("editInicio").value = prova.dataHoraInicio ? prova.dataHoraInicio.slice(0, 16) : '';
      document.getElementById("editFim").value = prova.dataHoraFim ? prova.dataHoraFim.slice(0, 16) : '';
      document.getElementById("editCodigo").value = prova.codigo;

      new bootstrap.Modal(document.getElementById("editarModal")).show();
    } catch (error) {
      alert("Erro ao buscar prova.");
    }
  }

  document.getElementById("editarForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const id = document.getElementById("editId").value;
    const titulo = document.getElementById("editTitulo").value;
    const inicio = document.getElementById("editInicio").value;
    const fim = document.getElementById("editFim").value;
    const codigo = document.getElementById("editCodigo").value;
    const idProfessor = document.getElementById("professorId").value;

    try {
      await axios.put(`${API_BASE_URL}/Prova/AtualizarProva`, {
        id: parseInt(id),
        titulo,
        dataHoraInicio: inicio,
        dataHoraFim: fim,
        dataHoraRegistro: new Date().toISOString(),
        codigo,
        idProfessor: parseInt(idProfessor)
      });

      bootstrap.Modal.getInstance(document.getElementById("editarModal")).hide();
      buscarProvasDoProfessor();
    } catch (error) {
      alert("Erro ao atualizar prova.");
    }
  });

  async function removerProva(id) {
    if (!confirm("Deseja realmente apagar esta prova?")) return;

    try {
      await axios.delete(`${API_BASE_URL}/Prova/RemoverProva?Id=${id}`);
      buscarProvasDoProfessor();
    } catch (error) {
      alert("Erro ao apagar prova.");
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
