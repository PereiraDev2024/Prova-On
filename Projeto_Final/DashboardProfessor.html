<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard do Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2>Dashboard do Professor</h2>

  <!-- ID do Professor -->
  <div class="mb-4">
    <label for="professorId" class="form-label">ID do Professor:</label>
    <input type="number" id="professorId" class="form-control" placeholder="Digite o ID do professor">
    <button class="btn btn-primary mt-2" onclick="buscarProvasDoProfessor()">Buscar Provas</button>
  </div>

  <!-- Lista de Provas -->
  <div class="card">
    <div class="card-header">
      <h5>Provas Aplicadas</h5>
    </div>
    <ul class="list-group list-group-flush" id="listaProvas">
      <!-- Provas vão aqui -->
    </ul>
  </div>

  <!-- Alunos da prova -->
  <div class="mt-5" id="alunosContainer" style="display:none;">
    <h4>Alunos que fizeram a prova: <span id="tituloProvaSelecionada"></span></h4>
    <ul class="list-group" id="listaAlunos"></ul>
  </div>
</div>

<!-- Modal para editar prova -->
<div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editarForm">
        <div class="modal-header">
          <h5 class="modal-title">Editar Prova</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId" />
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" id="editTitulo" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Data/Hora Início</label>
            <input type="datetime-local" id="editInicio" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Data/Hora Fim</label>
            <input type="datetime-local" id="editFim" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Código</label>
            <input type="text" id="editCodigo" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Salvar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const API_BASE_URL = "https://sua-api.com"; // Atualize com sua URL real da API

  async function buscarProvasDoProfessor() {
    const idProfessor = document.getElementById("professorId").value;
    if (!idProfessor) return alert("Informe o ID do professor.");

    try {
      const response = await axios.get(`${API_BASE_URL}/provas/professor/${idProfessor}`);
      renderizarProvas(response.data);
    } catch (error) {
      console.error(error);
      alert("Erro ao buscar provas.");
    }
  }

  function renderizarProvas(provas) {
    const lista = document.getElementById("listaProvas");
    lista.innerHTML = "";

    provas.forEach(prova => {
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";
      li.innerHTML = `
        <div>
          <strong>${prova.titulo}</strong><br>
          Código: ${prova.codigo} | Início: ${new Date(prova.dataHoraInicio).toLocaleString()} | Fim: ${new Date(prova.dataHoraFim).toLocaleString()}
        </div>
        <div>
          <button class="btn btn-sm btn-info" onclick="verAlunos(${prova.id}, '${prova.titulo}')">Alunos</button>
          <button class="btn btn-sm btn-warning" onclick="abrirModalEditar(${prova.id})">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="removerProva(${prova.id})">Apagar</button>
        </div>
      `;
      lista.appendChild(li);
    });
  }

  async function verAlunos(provaId, titulo) {
    try {
      const response = await axios.get(`${API_BASE_URL}/provas/${provaId}/alunos`);
      document.getElementById("alunosContainer").style.display = "block";
      document.getElementById("tituloProvaSelecionada").textContent = titulo;

      const lista = document.getElementById("listaAlunos");
      lista.innerHTML = "";
      response.data.forEach(aluno => {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = aluno.nome; // ajuste conforme seu modelo
        lista.appendChild(li);
      });
    } catch (error) {
      alert("Erro ao buscar alunos.");
    }
  }

  async function abrirModalEditar(id) {
    try {
      const response = await axios.get(`${API_BASE_URL}/provas/${id}`);
      const prova = response.data;

      document.getElementById("editId").value = prova.id;
      document.getElementById("editTitulo").value = prova.titulo;
      document.getElementById("editInicio").value = prova.dataHoraInicio.slice(0,16);
      document.getElementById("editFim").value = prova.dataHoraFim.slice(0,16);
      document.getElementById("editCodigo").value = prova.codigo;

      new bootstrap.Modal(document.getElementById("editarModal")).show();
    } catch (error) {
      alert("Erro ao buscar prova.");
    }
  }

  document.getElementById("editarForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const id = document.getElementById("editId").value;
    const titulo = document.getElementById("editTitulo").value;
    const inicio = document.getElementById("editInicio").value;
    const fim = document.getElementById("editFim").value;
    const codigo = document.getElementById("editCodigo").value;
    const idProfessor = document.getElementById("professorId").value;

    try {
      await axios.put(`${API_BASE_URL}/provas/${id}`, {
        id: parseInt(id),
        titulo,
        dataHoraInicio: inicio,
        dataHoraFim: fim,
        dataHoraRegistro: new Date().toISOString(),
        codigo,
        idProfessor: parseInt(idProfessor)
      });

      bootstrap.Modal.getInstance(document.getElementById("editarModal")).hide();
      buscarProvasDoProfessor();
    } catch (error) {
      alert("Erro ao atualizar prova.");
    }
  });

  async function removerProva(id) {
    if (!confirm("Deseja realmente apagar esta prova?")) return;

    try {
      await axios.delete(`${API_BASE_URL}/provas/${id}`);
      buscarProvasDoProfessor();
    } catch (error) {
      alert("Erro ao apagar prova.");
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
