<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Listagem de Provas Criadas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-color: #f1f1f1;">
<div id="offcanvas">

</div>
  <div style="margin-top: 40px; max-width: 900px; background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-left: auto; margin-right: auto;">
    <h2 class="text-center mb-4">Provas Criadas</h2>

    <table class="table table-bordered table-striped" style="width: 100%;">
      <thead>
        <tr>
          <th style="vertical-align: middle;">Nome da Prova</th>
          <th style="vertical-align: middle;">Data</th>
          <th style="vertical-align: middle;">Codigo</th>
          <th style="vertical-align: middle;">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaProvas">
        <!-- As provas serão carregadas aqui -->
      </tbody>
    </table>
  </div>

  <script>
    async function carregarProvas() {
      try {
        const resposta = await fetch("https://localhost:7141/ListarProva");
        const provas = await resposta.json();

        const tabelaProvas = document.getElementById("tabelaProvas");
        tabelaProvas.innerHTML = '';

        provas.forEach(prova => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="vertical-align: middle;">${prova.titulo}</td>
            <td style="vertical-align: middle;">${new Date(prova.dataHoraRegistro).toLocaleDateString()}</td>
            <td style="vertical-align: middle;">${prova.codigo}</td>
            <td style="vertical-align: middle;">
              <button style="margin-left:10px;" class="btn btn-warning btn-sm" onclick="editarProva(${prova.id})">
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button style="margin-left:10px;" class="btn btn-danger btn-sm" onclick="deletarProva(${prova.id})">
                <i class="bi bi-trash"></i> Deletar
              </button>
            </td>
          `;
          tabelaProvas.appendChild(tr);
        });
      } catch (error) {
        console.error('Erro ao carregar provas:', error);
        Swal.fire('Erro', 'Não foi possível carregar as provas.', 'error');
      }
    }

    function editarProva(id) {
      Swal.fire('Editar Prova', `Editar prova com ID: ${id}`, 'info');
      // Coloque aqui a lógica para editar
    }

    async function deletarProva(id) {
      const result = await Swal.fire({
        title: 'Tem certeza?',
        text: "Essa ação não pode ser revertida!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, deletar!',
        cancelButtonText: 'Cancelar'
      });

      if (result.isConfirmed) {
        try {
          const resposta = await fetch(`https://localhost:7141/RemoverProva${id}`, {
            method: 'DELETE'
          });

          if (resposta.ok) {
            Swal.fire('Deletado!', 'Prova excluída com sucesso.', 'success');
            carregarProvas();
          } else {
            Swal.fire('Erro', 'Não foi possível excluir a prova.', 'error');
          }
        } catch (error) {
          console.error('Erro ao excluir prova:', error);
          Swal.fire('Erro', 'Erro na requisição ao excluir prova.', 'error');
        }
      }
    }

    carregarProvas();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Script.js"></script>
</body>
</html>
