<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Listagem de Provas Criadas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f1f1;
    }
    .container {
      margin-top: 40px;
      max-width: 900px;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-section {
      margin-top: 20px;
    }
    .table th, .table td {
      vertical-align: middle;
    }
    .btn-action {
      margin-left: 10px;
    }
  </style>
</head>
<body>
    <div id="offcanvas">

    </div>
  <!-- Listagem de Provas -->
  <div class="container">
    <h2 class="text-center mb-4">Provas Criadas</h2>

    <!-- Tabela de Provas -->
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Nome da Prova</th>
          <th>Data</th>
          <th>Disciplina</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaProvas">
        <!-- As provas serão carregadas aqui -->
      </tbody>
    </table>
  </div>

  <script>
    // Função simulada para carregar provas de uma API
    async function carregarProvas() {
      try {
        // Supondo que a API devolva um array de provas
        const resposta = await fetch("https://SEU_BACKEND/api/provas");
        const provas = await resposta.json();

        // Preencher a tabela com as provas
        const tabelaProvas = document.getElementById("tabelaProvas");
        tabelaProvas.innerHTML = '';

        provas.forEach(prova => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${prova.nome}</td>
            <td>${new Date(prova.dataHoraRegistro).toLocaleDateString()}</td>
            <td>${prova.disciplina}</td>
            <td>
              <button class="btn btn-warning btn-sm btn-action" onclick="editarProva(${prova.id})">
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button class="btn btn-danger btn-sm btn-action" onclick="deletarProva(${prova.id})">
                <i class="bi bi-trash"></i> Deletar
              </button>
            </td>
          `;
          tabelaProvas.appendChild(tr);
        });
      } catch (error) {
        console.error('Erro ao carregar provas:', error);
      }
    }

    // Função para editar a prova (abrir o formulário com dados da prova)
    function editarProva(id) {
      alert(`Editar prova com ID: ${id}`);
      // Lógica de edição vai aqui
    }

    // Função para excluir a prova
    async function deletarProva(id) {
      const confirmacao = confirm('Tem certeza que deseja excluir esta prova?');
      if (!confirmacao) return;

      try {
        // Simulando a exclusão
        const resposta = await fetch(`https://SEU_BACKEND/api/provas/${id}`, {
          method: 'DELETE'
        });

        if (resposta.ok) {
          alert('Prova excluída com sucesso!');
          carregarProvas(); // Recarregar a lista
        } else {
          alert('Erro ao excluir a prova!');
        }
      } catch (error) {
        console.error('Erro ao excluir prova:', error);
      }
    }

    // Carregar as provas ao iniciar
    carregarProvas();
  </script>
  <script src="Script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
