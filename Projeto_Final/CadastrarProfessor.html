<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuário</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .form-container {
      max-width: 500px;
      margin: 60px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .offcanvas .btn-logout {
      position: absolute;
      bottom: 20px;
      width: 90%;
      left: 5%;
    }
  </style>
</head>
<body>

  <div id="offcanvas">

  </div>

  <!-- Formulário de Cadastro -->
  <div class="form-container">
    <h2 class="text-center mb-4"><i class="bi bi-person-plus me-2"></i>Cadastro de Usuário</h2>
    <form id="cadastroForm">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-send me-2"></i> Cadastrar
      </button>
    </form>

    <div id="mensagem" class="mt-3"></div>
  </div>

  <!-- Script JS para enviar para API -->
  <script>
    document.getElementById("cadastroForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const dataHoraRegistro = new Date().toISOString();

      const usuario = {
        id: 0, // ID será ignorado no back geralmente
        nome,
        email,
        senha,
        dataHoraRegistro
      };

      try {
        const resposta = await fetch("https://SEU_BACKEND/api/usuarios", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(usuario)
        });

        if (resposta.ok) {
          document.getElementById("mensagem").innerHTML = `
            <div class="alert alert-success" role="alert">
              Usuário cadastrado com sucesso!
            </div>
          `;
          document.getElementById("cadastroForm").reset();
        } else {
          const erro = await resposta.text();
          document.getElementById("mensagem").innerHTML = `
            <div class="alert alert-danger" role="alert">
              Erro ao cadastrar: ${erro}
            </div>
          `;
        }
      } catch (error) {
        document.getElementById("mensagem").innerHTML = `
          <div class="alert alert-danger" role="alert">
            Erro de conexão com o servidor.
          </div>
        `;
      }
    });
  </script>
  <script src="Script.js"></script>
</body>
</html>
