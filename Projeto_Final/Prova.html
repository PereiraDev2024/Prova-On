<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prova</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-color:#ede7f6; font-family: 'Roboto', sans-serif;">

<div id="timer" style="position:fixed; top:20px; right:30px; background-color:#673ab7; color:#fff; padding:8px 15px; border-radius:8px; font-weight:bold; font-size:16px; z-index:1000;">60:00</div>

<div class="container py-5">
  <div style="max-width:700px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0px 2px 8px rgba(0,0,0,0.15);">
    <div class="text-center mb-4">
      <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" style="max-width:90px;">
      <h2 id="tituloProva" style="font-weight:bold; margin-top:10px;">Carregando prova...</h2>
      <p style="color:#5f6368; font-size:14px;">Responda todas as questões. Tempo estimado: 60 minutos.</p>
    </div>

    <div id="perguntasContainer">
      <div class="text-center py-4">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Carregando perguntas...</p>
      </div>
    </div>

    <div class="text-center mt-4" id="botoesContainer" style="display:none;">
      <button id="btnEnviar" class="btn" style="background-color:#673ab7; color:#fff; padding:10px 30px; border-radius:8px; font-weight:500;">Enviar Prova</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE_URL = "http://localhost:5150";

const provaId = sessionStorage.getItem('provaId');
const alunoId = sessionStorage.getItem('alunoId');
const provaTitulo = sessionStorage.getItem('provaTitulo');

// Redireciona se não houver sessão válida
if (!provaId || !alunoId) {
  window.location.href = 'CodigoAcessoProva.html';
}

let perguntas = [];
let totalSegundos = 60 * 60;
let intervalo;

async function carregarPerguntas() {
  try {
    const response = await axios.get(`${API_BASE_URL}/PerguntaObjetiva/ListarPorProva/${provaId}`);
    perguntas = response.data;

    if (provaTitulo) {
      document.getElementById('tituloProva').textContent = provaTitulo;
    }

    if (perguntas.length === 0) {
      document.getElementById('perguntasContainer').innerHTML =
        '<div class="alert alert-warning">Esta prova não possui perguntas cadastradas.</div>';
      return;
    }

    renderizarPerguntas(perguntas);
    document.getElementById('botoesContainer').style.display = 'block';
  } catch (error) {
    document.getElementById('perguntasContainer').innerHTML =
      '<div class="alert alert-danger">Erro ao carregar as perguntas. Verifique se a API está ativa.</div>';
    console.error(error);
  }
}

function renderizarPerguntas(lista) {
  const container = document.getElementById('perguntasContainer');
  container.innerHTML = '';

  lista.forEach((p, index) => {
    const div = document.createElement('div');
    div.className = 'mb-4';
    div.innerHTML = `
      <p style="font-weight:500;">${index + 1}. ${p.titulo}</p>
      ${p.descricao ? `<p style="color:#5f6368; font-size:14px;">${p.descricao}</p>` : ''}
      <div class="form-check">
        <input class="form-check-input" type="radio" name="q${p.id}" id="q${p.id}_a" value="A" required>
        <label class="form-check-label" for="q${p.id}_a">A) ${p.opcaoa}</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="q${p.id}" id="q${p.id}_b" value="B">
        <label class="form-check-label" for="q${p.id}_b">B) ${p.opcaob}</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="q${p.id}" id="q${p.id}_c" value="C">
        <label class="form-check-label" for="q${p.id}_c">C) ${p.opcaoc}</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="q${p.id}" id="q${p.id}_d" value="D">
        <label class="form-check-label" for="q${p.id}_d">D) ${p.opcaod}</label>
      </div>
      <hr>
    `;
    container.appendChild(div);
  });
}

function iniciarTimer() {
  const timerElemento = document.getElementById('timer');
  intervalo = setInterval(function () {
    const minutos = Math.floor(totalSegundos / 60);
    const segundos = totalSegundos % 60;
    timerElemento.textContent = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;
    if (totalSegundos <= 0) {
      clearInterval(intervalo);
      Swal.fire({
        icon: 'warning',
        title: 'Tempo esgotado!',
        text: 'Enviando sua prova automaticamente...',
        confirmButtonColor: '#673ab7',
        allowOutsideClick: false
      }).then(() => enviarProva());
    }
    totalSegundos--;
  }, 1000);
}

function desabilitarFormulario() {
  document.querySelectorAll('input[type=radio]').forEach(el => el.disabled = true);
  document.getElementById('btnEnviar').disabled = true;
}

async function enviarProva() {
  desabilitarFormulario();
  clearInterval(intervalo);

  // Coleta respostas marcadas
  const respostasParaEnviar = [];
  for (const p of perguntas) {
    const selecionado = document.querySelector(`input[name="q${p.id}"]:checked`);
    if (selecionado) {
      respostasParaEnviar.push({
        idAluno: parseInt(alunoId),
        idPerguntaObjetiva: p.id,
        resposta: selecionado.value
      });
    }
  }

  if (respostasParaEnviar.length === 0) {
    Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Você não respondeu nenhuma questão.' });
    return;
  }

  try {
    // Envia cada resposta individualmente
    for (const resposta of respostasParaEnviar) {
      await axios.post(`${API_BASE_URL}/AlunoRespostaObjetiva/CadastrarAlunoRespostaObjetiva`, resposta);
    }

    Swal.fire({
      icon: 'success',
      title: 'Prova enviada!',
      text: 'Suas respostas foram registradas com sucesso.',
      confirmButtonColor: '#673ab7',
      allowOutsideClick: false
    }).then(() => {
      window.location.href = 'Resultado.html';
    });
  } catch (err) {
    console.error(err);
    Swal.fire({
      icon: 'error',
      title: 'Erro ao enviar',
      text: 'Ocorreu um erro ao enviar a prova. Tente novamente.',
      confirmButtonColor: '#673ab7'
    });
    // Reabilita para nova tentativa
    document.querySelectorAll('input[type=radio]').forEach(el => el.disabled = false);
    document.getElementById('btnEnviar').disabled = false;
    iniciarTimer();
  }
}

document.getElementById('btnEnviar').addEventListener('click', async function () {
  // Verificar se todas as perguntas foram respondidas
  const naoRespondidas = perguntas.filter(p => !document.querySelector(`input[name="q${p.id}"]:checked`));
  if (naoRespondidas.length > 0) {
    const result = await Swal.fire({
      icon: 'question',
      title: 'Perguntas sem resposta',
      text: `Você deixou ${naoRespondidas.length} questão(ões) sem resposta. Deseja enviar mesmo assim?`,
      showCancelButton: true,
      confirmButtonText: 'Sim, enviar',
      cancelButtonText: 'Voltar',
      confirmButtonColor: '#673ab7'
    });
    if (!result.isConfirmed) return;
  }
  await enviarProva();
});

// Inicialização
window.onload = function () {
  Swal.fire({
    title: 'Deseja iniciar a prova?',
    text: 'Você terá 60 minutos para completá-la.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Sim',
    cancelButtonText: 'Não',
    confirmButtonColor: '#673ab7',
    allowOutsideClick: false,
    allowEscapeKey: false
  }).then((result) => {
    if (!result.isConfirmed) {
      window.location.href = 'CodigoAcessoProva.html';
    } else {
      carregarPerguntas();
      iniciarTimer();
    }
  });
};
</script>
</body>
</html>
