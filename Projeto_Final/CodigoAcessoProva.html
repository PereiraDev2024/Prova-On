<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso à Prova</title>
  <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 w-100" style="max-width: 400px;">
      <div class="text-center">
        <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" class="mb-4" width="100">
      </div>
      <h5 class="text-center mb-3">Digite o código de acesso à prova</h5>
      <form id="formCodigo">
        <div class="mb-3">
          <input type="text" class="form-control" id="input_codigo" placeholder="Insira o código" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Acessar</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:5150";

    document.getElementById('formCodigo').addEventListener('submit', async function(e) {
      e.preventDefault();
      const codigo = document.getElementById('input_codigo').value.trim();

      if (codigo === '') {
        Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Por favor, insira um código.' });
        return;
      }

      try {
        const response = await axios.get(`${API_BASE_URL}/Prova/BuscarProvaPorCodigo/${encodeURIComponent(codigo)}`);
        const prova = response.data;

        sessionStorage.setItem('provaId', prova.id);
        sessionStorage.setItem('provaTitulo', prova.titulo);

        window.location.href = "Cadastroaluno.html";
      } catch (error) {
        if (error.response && error.response.status === 404) {
          Swal.fire({ icon: 'error', title: 'Código inválido', text: 'Nenhuma prova encontrada com esse código.' });
        } else {
          Swal.fire({ icon: 'error', title: 'Erro', text: 'Não foi possível conectar à API. Verifique se o servidor está ativo.' });
        }
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
