<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro Completo de Provas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f1f1;
    }
    .container {
      margin-top: 40px;
      max-width: 900px;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-section {
      margin-top: 20px;
    }
  </style>
</head>
<body>

    <div id="offcanvas">

    </div>

<div class="container">
  <h2 class="text-center mb-4">Cadastro de Prova </h2>

  <!-- Formulário da Prova -->
  <form id="formProva">
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="nomeProva" class="form-label">Nome da Prova</label>
        <input type="text" class="form-control" id="nomeProva" required>
      </div>
      <div class="col-md-6">
        <label for="dataProva" class="form-label">Data</label>
        <input type="date" class="form-control" id="dataProva" required>
      </div>
    </div>
    <div class="mb-3">
      <label for="disciplina" class="form-label">Disciplina</label>
      <select class="form-select" id="disciplina" required>
        <option value="">Selecione</option>
        <option value="Matemática">Matemática</option>
        <option value="Português">Português</option>
        <option value="História">História</option>
        <option value="Ciências">Ciências</option>
      </select>
    </div>
  </form>

  <!-- Abas de Cadastro de Perguntas -->
  <ul class="nav nav-tabs mt-4" id="questionTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="objetiva-tab" data-bs-toggle="tab" data-bs-target="#objetiva" type="button" role="tab">Pergunta Objetiva</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="discursiva-tab" data-bs-toggle="tab" data-bs-target="#discursiva" type="button" role="tab">Pergunta Discursiva</button>
    </li>
  </ul>

  <div class="tab-content form-section" id="questionTabContent">
    <!-- Objetiva -->
    <div class="tab-pane fade show active" id="objetiva" role="tabpanel">
      <form id="formObjetiva">
        <div class="mb-3">
          <label for="enunciadoObjetiva" class="form-label">Enunciado</label>
          <textarea class="form-control" id="enunciadoObjetiva" rows="2" required></textarea>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Alternativa A</label>
            <input type="text" class="form-control" id="altA" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Alternativa B</label>
            <input type="text" class="form-control" id="altB" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Alternativa C</label>
            <input type="text" class="form-control" id="altC" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Alternativa D</label>
            <input type="text" class="form-control" id="altD" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="respostaCorreta" class="form-label">Resposta Correta</label>
          <select class="form-select" id="respostaCorreta" required>
            <option value="">Selecione</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Adicionar Objetiva</button>
      </form>
    </div>

    <!-- Discursiva -->
    <div class="tab-pane fade" id="discursiva" role="tabpanel">
      <form id="formDiscursiva">
        <div class="mb-3">
          <label for="enunciadoDiscursiva" class="form-label">Enunciado</label>
          <textarea class="form-control" id="enunciadoDiscursiva" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label for="respostaModelo" class="form-label">Resposta Modelo (opcional)</label>
          <textarea class="form-control" id="respostaModelo" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-success">Adicionar Discursiva</button>
      </form>
    </div>
  </div>

  <!-- Lista de Perguntas -->
  <div class="form-section">
    <h4 class="mt-4">Perguntas Cadastradas</h4>
    <ul id="listaPerguntas" class="list-group mt-2"></ul>
  </div>
  <br>
  <br>
  <form>
    <button class="btn btn-success" id="button_enviarProva">
        Enviar
    </button>
  </form>

</div>
<script>
  const listaPerguntas = document.getElementById('listaPerguntas');

  // Adicionar Pergunta Objetiva
  document.getElementById('formObjetiva').addEventListener('submit', function(e) {
    e.preventDefault();

    const enunciado = document.getElementById('enunciadoObjetiva').value.trim();
    const altA = document.getElementById('altA').value.trim();
    const altB = document.getElementById('altB').value.trim();
    const altC = document.getElementById('altC').value.trim();
    const altD = document.getElementById('altD').value.trim();
    const correta = document.getElementById('respostaCorreta').value;

    if (!enunciado || !altA || !altB || !altC || !altD || !correta) {
      alert("Preencha todos os campos.");
      return;
    }

    const item = document.createElement('li');
    item.className = 'list-group-item';
    item.innerHTML = `
      <strong>Objetiva:</strong> ${enunciado}<br>
      A) ${altA}<br>
      B) ${altB}<br>
      C) ${altC}<br>
      D) ${altD}<br>
      <strong>Correta:</strong> ${correta}
    `;
    listaPerguntas.appendChild(item);
    this.reset();
  });

  // Adicionar Pergunta Discursiva
  document.getElementById('formDiscursiva').addEventListener('submit', function(e) {
    e.preventDefault();

    const enunciado = document.getElementById('enunciadoDiscursiva').value.trim();
    const respostaModelo = document.getElementById('respostaModelo').value.trim();

    if (!enunciado) {
      alert("Preencha o enunciado.");
      return;
    }

    const item = document.createElement('li');
    item.className = 'list-group-item';
    item.innerHTML = `
      <strong>Discursiva:</strong> ${enunciado}<br>
      ${respostaModelo ? `<em>Resposta Modelo:</em> ${respostaModelo}` : ''}
    `;
    listaPerguntas.appendChild(item);
    this.reset();
  });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="Script.js"></script>
