<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

    <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" class="d-block mx-auto" width="5%" height="5%">
    <br>

    <h1 class="text-center">Resultado da Prova</h1>

    <div class="row">
        <div class="offset-3 col-6">

            <div id="resultadoContainer">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Carregando resultado...</p>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="CodigoAcessoProva.html" class="btn btn-outline-secondary px-4">Voltar ao Início</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = "http://localhost:5150";
        const alunoId = sessionStorage.getItem('alunoId');
        const provaId = sessionStorage.getItem('provaId');
        const provaTitulo = sessionStorage.getItem('provaTitulo') || 'Prova';

        async function carregarResultado() {
            const container = document.getElementById('resultadoContainer');

            if (!alunoId || !provaId) {
                container.innerHTML = `
                    <div class="alert alert-warning text-center" role="alert">
                        <h4 class="alert-heading">Sessão expirada</h4>
                        <p>Não foi possível identificar o aluno ou a prova. Por favor, acesse novamente.</p>
                    </div>`;
                return;
            }

            try {
                // Busca pontuação total
                const pontuacaoResp = await axios.get(
                    `${API_BASE_URL}/AlunoRespostaObjetiva/PontuacaoAluno?alunoId=${alunoId}&provaId=${provaId}`
                );
                const pontuacao = pontuacaoResp.data.pontuacao;

                // Busca histórico detalhado (questão a questão)
                let historicoHTML = '';
                try {
                    const historicoResp = await axios.get(`${API_BASE_URL}/Aluno/Historico?id=${alunoId}`);
                    const historico = historicoResp.data;
                    if (historico && historico.length > 0) {
                        const linhas = historico.map((h, i) => `
                            <tr>
                                <td>${i + 1}</td>
                                <td>${h.pergunta}</td>
                                <td class="text-center"><strong>${h.opcaocorreta}</strong></td>
                                <td class="text-center ${h.pontuacaofinal > 0 ? 'text-success' : 'text-danger'}">
                                    ${h.pontuacaofinal > 0 ? '✔ Acerto' : '✘ Erro'}
                                </td>
                                <td class="text-end">${h.pontuacaofinal.toFixed(2)}</td>
                            </tr>`).join('');
                        historicoHTML = `
                            <h5 class="mt-4">Detalhamento por questão</h5>
                            <table class="table table-bordered table-sm">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Pergunta</th>
                                        <th class="text-center">Gabarito</th>
                                        <th class="text-center">Resultado</th>
                                        <th class="text-end">Pontos</th>
                                    </tr>
                                </thead>
                                <tbody>${linhas}</tbody>
                            </table>`;
                    }
                } catch (_) {
                    // Histórico é opcional; ignora erro
                }

                container.innerHTML = `
                    <div class="alert alert-success text-center mt-4" role="alert">
                        <h4 class="alert-heading">Prova concluída!</h4>
                        <p>Prova: <strong>${provaTitulo}</strong></p>
                        <hr>
                        <p class="mb-0 fs-4">Sua pontuação: <strong>${parseFloat(pontuacao).toFixed(2)}</strong></p>
                    </div>
                    ${historicoHTML}`;

                // Limpa sessão após exibir resultado
                sessionStorage.removeItem('provaId');
                sessionStorage.removeItem('alunoId');
                sessionStorage.removeItem('provaTitulo');

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="alert alert-danger text-center mt-4" role="alert">
                        <h4 class="alert-heading">Erro ao carregar resultado</h4>
                        <p>Não foi possível buscar sua pontuação. Tente novamente em instantes.</p>
                    </div>`;
            }
        }

        carregarResultado();
    </script>
</body>
</html>
