<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- InputMask CSS -->
  <link href="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.css" rel="stylesheet">

  <!-- Favicon -->
  <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- InputMask JS -->
  <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
</head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="row w-100">
      <div class="offset-md-3 col-md-6">
        <div class="card shadow-lg">
          <div class="card-body p-4">

            <!-- Imagem no centro -->
            <div class="text-center mb-4">
              <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" class="d-block mx-auto" width="50%" height="auto">
            </div>

            <h3 class="text-center mb-4">Login</h3>

            <form id="loginForm">
              <!-- Campo E-mail -->
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@dominio.com" required>
              </div>

              <!-- Campo Senha -->
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
              </div>

              <!-- Botões -->
              <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Acessar</button>
                <button type="reset" class="btn btn-outline-secondary">Limpar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (para utilizar componentes como modais, popovers, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Máscara no campo de e-mail (caso necessário)
    const emailInput = document.getElementById("email");
    Inputmask({"mask": "*{1,15}@[a-z]{1,15}.com"}).mask(emailInput);

    // Manipulação do formulário
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Validando campos
      if (!email || !password) {
        alert("Preencha todos os campos.");
        return;
      }

      // Enviando a requisição para a API com Axios
      try {
        const response = await axios.post("https://sua-api.com/login", {
          email,
          password
        });

        // Verificando a resposta da API
        if (response.data.success) {
          alert("Login realizado com sucesso!");
          // Redirecionando ou executando ações após o login bem-sucedido
        } else {
          alert("E-mail ou senha inválidos.");
        }
      } catch (error) {
        console.error("Erro na requisição:", error);
        alert("Ocorreu um erro ao tentar realizar o login.");
      }
    });
  </script>
</body>
</html>
