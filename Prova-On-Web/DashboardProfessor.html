<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="api-base-url" content="https://localhost:7141">
  <title>Dashboard do Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- Axios removed; logic moved to frontend modules -->
<body class="bg-light">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2>Dashboard do Professor</h2>

  <!-- ID do Professor -->
  <div class="mb-4">
    <label for="professorId" class="form-label">ID do Professor:</label>
    <input type="number" id="professorId" class="form-control" placeholder="Digite o ID do professor">
    <button class="btn btn-primary mt-2" onclick="buscarProvasDoProfessor()">Buscar Provas</button>
  </div>

  <!-- Lista de Provas -->
  <div class="card">
    <div class="card-header">
      <h5>Provas Aplicadas</h5>
    </div>
    <ul class="list-group list-group-flush" id="listaProvas">
      <!-- Provas vão aqui -->
    </ul>
  </div>

  <!-- Alunos e pontuações da prova -->
  <div class="mt-5" id="alunosContainer" style="display:none;">
    <h4>Resultados da prova: <span id="tituloProvaSelecionada"></span></h4>
    <table class="table table-bordered table-sm mt-3" id="tabelaAlunos">
      <thead class="table-light">
        <tr>
          <th>Aluno</th>
          <th class="text-end">Pontuação</th>
        </tr>
      </thead>
      <tbody id="corpoTabelaAlunos"></tbody>
    </table>
    <div id="semResultados" class="alert alert-info" style="display:none;">
      Nenhum aluno realizou esta prova ainda.
    </div>
  </div>
</div>

<!-- Modal para editar prova -->
<div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editarForm">
        <div class="modal-header">
          <h5 class="modal-title">Editar Prova</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId" />
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" id="editTitulo" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Data/Hora Início</label>
            <input type="datetime-local" id="editInicio" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Data/Hora Fim</label>
            <input type="datetime-local" id="editFim" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Código</label>
            <input type="text" id="editCodigo" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Salvar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <!-- Inline script migrated to frontend/js/modules/dashboardProfessor.module.js -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../frontend/js/main.js"></script>
</body>
</html>
