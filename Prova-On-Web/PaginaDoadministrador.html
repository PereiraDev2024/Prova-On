<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="https://localhost:7141">
    <title>Painel do Administrador</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- InputMask CSS -->
    <link href="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

    <!-- InputMask JS -->
    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5" style="max-width: 900px;">
        <h2 class="mb-4 text-center">Painel do Administrador</h2>

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <label for="professorId" class="form-label fw-semibold">ID do Professor</label>
                <div class="input-group">
                    <input type="number" id="professorId" class="form-control" placeholder="Digite o ID do professor">
                    <button id="btnBuscarProvas" class="btn btn-primary" type="button">Buscar Provas</button>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Provas Aplicadas</h5>
            </div>
            <ul class="list-group list-group-flush" id="listaProvas"></ul>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Cadastrar Aluno</h5>
            </div>
            <div class="card-body">
                <form id="formCadastrarAluno">
                    <div class="mb-3">
                        <label for="nomeAluno" class="form-label">Nome do Aluno</label>
                        <input type="text" id="nomeAluno" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="dataNascimentoAluno" class="form-label">Data de Nascimento</label>
                        <input type="date" id="dataNascimentoAluno" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="provaAluno" class="form-label">Prova</label>
                        <select id="provaAluno" class="form-select" required>
                            <option value="">Selecione uma prova</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Cadastrar Aluno</button>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Remover Professor</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="removerProfessorId" class="form-label">ID do Professor</label>
                    <input type="number" id="removerProfessorId" class="form-control" placeholder="Digite o ID do professor">
                </div>

                <div class="d-flex gap-2">
                    <button id="btnRemoverProfessor" class="btn btn-danger" type="button">Remover Professor</button>
                    <button id="btnListarProfessores" class="btn btn-outline-danger" type="button">Listar Professores</button>
                </div>

                <ul class="list-group mt-3" id="listaProfessores"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../frontend/js/main.js"></script>
</body>
</html>
