<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="https://localhost:7141">
    <title>Prova</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- InputMask CSS -->
    <link href="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

    <!-- Axios removed; using frontend/js/api/api.js -->
    <!-- InputMask JS -->
    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
</head>

<body class="bg-light">
    <div id="timer" class="position-fixed top-0 end-0 m-3 bg-primary text-white px-3 py-2 rounded fw-bold" style="z-index:1000;">60:00</div>

    <div class="container py-5">
        <div class="mx-auto bg-white p-4 rounded shadow" style="max-width:700px;">
            <div class="text-center mb-4">
                <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" style="max-width:90px;">
                <h2 id="tituloProva" class="fw-bold mt-2">Carregando prova...</h2>
                <p class="text-muted small">Responda todas as questões. Tempo estimado: 60 minutos.</p>
            </div>

            <div id="perguntasContainer">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Carregando perguntas...</p>
                </div>
            </div>

            <div class="text-center mt-4 d-none" id="botoesContainer">
                <button id="btnEnviar" class="btn btn-primary" type="button">Enviar Prova</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../frontend/js/main.js"></script>
</body>
</html>
