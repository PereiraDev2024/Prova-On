<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="https://localhost:7141">
    <title>Acesso à Prova</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- InputMask CSS -->
    <link href="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

    <!-- InputMask JS -->
    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row w-100">
            <div class="offset-md-3 col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" class="d-block mx-auto" width="50%" height="auto">
                        </div>

                        <h3 class="text-center mb-4">Acesso à Prova</h3>

                        <form id="formCodigo">
                            <div class="mb-3">
                                <label for="input_codigo" class="form-label">Código de acesso</label>
                                <input type="text" class="form-control" id="input_codigo" placeholder="Insira o código" required>
                            </div>

                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-success">Acessar</button>
                                <button type="reset" class="btn btn-outline-secondary">Limpar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../frontend/js/main.js"></script>
</body>
</html>
