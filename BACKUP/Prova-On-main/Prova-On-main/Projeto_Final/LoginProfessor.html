<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- InputMask CSS -->
  <link href="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.css" rel="stylesheet">

  <!-- Favicon -->
  <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- InputMask JS -->
  <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>

  <!-- SweetAlert2 (opcional, para alertas mais bonitos) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="row w-100">
      <div class="offset-md-3 col-md-6">
        <div class="card shadow-lg">
          <div class="card-body p-4">

            <!-- Imagem no centro -->
            <div class="text-center mb-4">
              <img src="imagens/logo_provaon.png" alt="Logo ProvaOn" class="d-block mx-auto" width="50%" height="auto">
            </div>

            <h3 class="text-center mb-4">Login</h3>

            <form id="loginForm">
              <!-- Campo E-mail -->
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@dominio.com" required>
              </div>

              <!-- Campo Senha -->
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
              </div>

              <!-- Botões -->
              <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Acessar</button>
                <button type="reset" class="btn btn-outline-secondary">Limpar</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Máscara no campo de e-mail
    Inputmask({"alias": "email"}).mask(document.getElementById("email"));

    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("password").value.trim();

      if (!email || !senha) {
        Swal.fire("Atenção", "Preencha todos os campos.", "warning");
        return;
      }

      try {
        const response = await axios.post("https://localhost:7141/Professor/LoginProfessor", {
          email: email,
          senha: senha
        });

        if (response.data.sucesso) {
          Swal.fire({
            icon: 'success',
            title: 'Login realizado!',
            text: `Bem-vindo, ${response.data.professor.nome}`,
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            // Redireciona para a página principal do sistema após login
            window.location.href = "PainelProfessor.html";  // Substitua pelo destino correto

            localStorage.setItem("professorLogado", JSON.stringify(response.data.professor));

          });
        } else {
          Swal.fire("Erro", "E-mail ou senha inválidos.", "error");
        }

      } catch (error) {
        if (error.response && error.response.status === 401) {
          Swal.fire("Erro", "Credenciais inválidas.", "error");
        } else {
          console.error("Erro na requisição:", error);
          Swal.fire("Erro", "Erro ao conectar à API.", "error");
        }
      }
    });
  </script>
</body>
</html>
