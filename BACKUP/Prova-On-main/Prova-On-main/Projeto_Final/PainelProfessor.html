<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do Professor</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Favicon -->
  <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">ProvaOn - Painel</a>
      <div class="d-flex">
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card shadow">
      <div class="card-header bg-secondary text-white">
        <h5 class="mb-0">Bem-vindo, <span id="nomeProfessor">Professor</span></h5>
      </div>
      <div class="card-body">

        <p class="lead">Este é o seu painel. Aqui você pode:</p>
        <ul>
          <li>Visualizar ou gerenciar provas</li>
          <li>Acompanhar desempenho dos alunos</li>
          <li>Editar suas informações</li>
        </ul>

        <hr>

        <div class="row">
          <div class="col-md-4 mb-3">
            <a href="CadastrarProva.html" class="btn btn-outline-success w-100">Cadastrar Nova Prova</a>
          </div>
          <div class="col-md-4 mb-3">
            <a href="ListarprovasProfessor.html" class="btn btn-outline-primary w-100">Ver Provas</a>
          </div>
          <div class="col-md-4 mb-3">
            <a href="perfil.html" class="btn btn-outline-dark w-100">Editar Perfil</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Carregar dados do professor do localStorage
    const professor = JSON.parse(localStorage.getItem('professorLogado'));

    if (!professor) {
      // Se não estiver logado, redireciona para o login
      window.location.href = "LoginProfessor.html";
    } else {
      document.getElementById("nomeProfessor").textContent = professor.nome;
    }

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("professorLogado");
      Swal.fire({
        icon: 'info',
        title: 'Logout realizado',
        timer: 1500,
        showConfirmButton: false
      }).then(() => {
        window.location.href = "LoginProfessor.html";
      });
    });
  </script>
</body>
</html>
