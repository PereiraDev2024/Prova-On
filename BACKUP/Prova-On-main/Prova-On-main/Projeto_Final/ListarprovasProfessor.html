<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Listagem de Provas Criadas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body style="background-color: #f1f1f1;">

<div id="offcanvas"></div>

<div style="margin-top: 40px; max-width: 900px; background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-left: auto; margin-right: auto;">
  <h2 class="text-center mb-4">Provas Criadas</h2>

  <table class="table table-bordered table-striped" style="width: 100%;">
    <thead>
      <tr>
        <th style="vertical-align: middle;">Nome da Prova</th>
        <th style="vertical-align: middle;">Data</th>
        <th style="vertical-align: middle;">Código</th>
        <th style="vertical-align: middle;">Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaProvas">
      <tr><td colspan="4" class="text-center text-muted">Carregando provas...</td></tr>
    </tbody>
  </table>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    carregarProvas();
  });

  async function carregarProvas() {
    const tabelaProvas = document.getElementById("tabelaProvas");
    tabelaProvas.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Carregando provas...</td></tr>';

    const professorLogado = JSON.parse(localStorage.getItem("professorLogado"));
    if (!professorLogado || !professorLogado.id) {
      Swal.fire('Erro', 'Professor não está logado.', 'error');
      tabelaProvas.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Professor não está logado.</td></tr>';
      return;
    }

    const professorId = professorLogado.id;

    try {
      const resposta = await fetch(`https://localhost:7141/ListarProvasProfessor/${professorId}`);

      if (!resposta.ok) {
        throw new Error('Erro na resposta da API: ' + resposta.status);
      }

      const provas = await resposta.json();

      if (!provas || provas.length === 0) {
        tabelaProvas.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhuma prova cadastrada.</td></tr>';
        return;
      }

      tabelaProvas.innerHTML = ''; // limpa

      provas.forEach(prova => {
        const dataFormatada = new Date(prova.dataHoraRegistro).toLocaleDateString('pt-BR');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="vertical-align: middle;">${prova.titulo}</td>
          <td style="vertical-align: middle;">${dataFormatada}</td>
          <td style="vertical-align: middle;">${prova.codigo}</td>
          <td style="vertical-align: middle;">
            <button class="btn btn-primary btn-sm" onclick="corrigirProva(${prova.id})">
              <i class="bi bi-clipboard-check"></i> Corrigir
            </button>
          </td>
        `;
        tabelaProvas.appendChild(tr);
      });

    } catch (error) {
      console.error(error);
      Swal.fire('Erro', 'Não foi possível carregar as provas.', 'error');
      tabelaProvas.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro ao carregar provas.</td></tr>';
    }
  }

  function corrigirProva(provaId) {
    // Como você não tem alunoId aqui, vamos remover o parâmetro para não gerar erro na página Corrigirprova.html
    window.location.href = `Corrigirprova.html?id=${provaId}`;
  }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="Script.js"></script>
</body>
</html>
