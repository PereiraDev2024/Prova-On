<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Aluno</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SweetAlert2 CSS (opcional para temas personalizados) -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.min.css" rel="stylesheet">

  <!-- IMask.js -->
  <script src="https://unpkg.com/imask"></script>
</head>
<body class="bg-light">



  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Acesso da Prova</h4>
      </div>
      <div class="card-body">

        <form id="formAluno">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome do Aluno</label>
            <input type="text" class="form-control" id="nome" name="nome" required />
          </div>

          <div class="mb-3">
            <label for="dataNascimento" class="form-label">Data de Nascimento</label>
            <input type="text" class="form-control" id="dataNascimento" name="dataNascimento" placeholder="dd/mm/aaaa" required />
          </div>

          <button type="submit" class="btn btn-success">Acessar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>

  <script>
    // Máscara para data de nascimento
    IMask(document.getElementById('dataNascimento'), {
      mask: '00/00/0000'
    });

    // Evento de submit do formulário
    document.getElementById('formAluno').addEventListener('submit', async function (e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const data = document.getElementById('dataNascimento').value.trim();

      // Validação básica da data
      const partes = data.split('/');
      if (partes.length !== 3 || partes[2].length !== 4) {
        Swal.fire({
          icon: 'error',
          title: 'Data inválida',
          text: 'Por favor, insira uma data no formato dd/mm/aaaa.'
        });
        return;
      }

      const dataISO = `${partes[2]}-${partes[1]}-${partes[0]}`;

      try {
        const response = await axios.post('https://jsonplaceholder.typicode.com/posts', {
          nome: nome,
          dataNascimento: dataISO
        });

        Swal.fire({
          icon: 'success',
          title: 'Sucesso!',
          text: 'Aluno cadastrado com sucesso.'
        })
        .then(() => {

          window.location.href = "Provaaluno.html"
          }
      );

        document.getElementById('formAluno').reset();

      } catch (error) {
        console.error(error);
        Swal.fire({
          icon: 'error',
          title: 'Erro ao cadastrar',
          text: 'Verifique se a API está ativa e funcionando corretamente.'
        });
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
