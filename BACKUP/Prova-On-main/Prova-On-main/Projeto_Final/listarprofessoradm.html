<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Listagem de Professores</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body style="background-color: #f1f1f1;">

    <div id="offcanvasadm">

    </div>

  <div style="margin-top: 40px; max-width: 900px; background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-left: auto; margin-right: auto;">
    <h2 class="text-center mb-4">Professores Cadastrados</h2>

    <table class="table table-bordered table-striped" style="width: 100%;">
      <thead>
        <tr>
          <th style="vertical-align: middle;">ID</th>
          <th style="vertical-align: middle;">Nome</th>
          <th style="vertical-align: middle;">Email</th>
          <th style="vertical-align: middle;">Data de Registro</th>
          <th style="vertical-align: middle;">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaProfessores">
        <tr><td colspan="4" class="text-center text-muted">Carregando professores...</td></tr>
      </tbody>
    </table>
  </div>

<script>
  const API_BASE_URL = "https://localhost:7141/Professor/ListarProfessor";

  async function carregarProfessores() {
    try {
      const response = await axios.get(API_BASE_URL);
      const professores = response.data;

      const tabela = document.getElementById('tabelaProfessores');
      tabela.innerHTML = '';

      if (!professores || professores.length === 0) {
        tabela.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Nenhum professor encontrado.</td></tr>`;
        return;
      }

      professores.forEach(professor => {
        const dataRegistro = professor.dataRegistro 
          ? new Date(professor.dataRegistro).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
          : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="vertical-align: middle;">${professor.id || '-'}</td>
          <td style="vertical-align: middle;">${professor.nome || '-'}</td>
          <td style="vertical-align: middle;">${professor.email || '-'}</td>
          <td style="vertical-align: middle;">${dataRegistro}</td>
          <td style="vertical-align: middle;">
            <button class="btn btn-warning btn-sm me-2" onclick="editarProfessor(${professor.id})">
              <i class="bi bi-pencil-square"></i> Editar
            </button>
            <button class="btn btn-danger btn-sm" onclick="deletarProfessor(${professor.id}, '${(professor.nome || '').replace(/'/g, "\\'")}')">
              <i class="bi bi-trash"></i> Deletar
            </button>
          </td>
        `;
        tabela.appendChild(tr);
      });

    } catch (error) {
      console.error('Erro ao carregar professores:', error);
      Swal.fire('Erro', 'Não foi possível carregar os professores.', 'error');
      const tabela = document.getElementById('tabelaProfessores');
      tabela.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Erro ao carregar dados.</td></tr>`;
    }
  }

  function editarProfessor(id) {
    Swal.fire('Editar Professor', `Aqui você pode implementar a edição do professor com ID ${id}`, 'info');
    // Aqui você pode redirecionar ou abrir um modal para editar o professor
  }

  async function deletarProfessor(id, nome) {
    const result = await Swal.fire({
      title: `Tem certeza que deseja deletar o professor "${nome}"?`,
      text: "Esta ação não pode ser desfeita!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Sim, deletar!',
      cancelButtonText: 'Cancelar'
    });

    if (!result.isConfirmed) return;

    try {
      const resposta = await axios.delete(`https://localhost:7141/Professor/RemoverProfessor?id=${id}`);

      if (resposta.status === 200) {
        Swal.fire('Deletado!', 'Professor excluído com sucesso.', 'success');
        carregarProfessores();
      } else {
        Swal.fire('Erro', 'Não foi possível excluir o professor.', 'error');
      }
    } catch (error) {
      console.error('Erro ao excluir professor:', error);
      Swal.fire('Erro', 'Erro na requisição para excluir professor.', 'error');
    }
  }

  // Carrega os professores assim que a página abrir
  carregarProfessores();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Ícones Bootstrap (opcional) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<script src="Script.js"></script>

</body>
</html>
