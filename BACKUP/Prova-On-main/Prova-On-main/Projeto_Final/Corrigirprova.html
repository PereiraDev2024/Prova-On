<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Corrigir Prova</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-color: #f1f1f1;">
  <div class="container mt-5 p-4 bg-white rounded shadow">
    <h2 class="mb-4 text-center">Correção da Prova</h2>

    <div id="provaInfo" class="mb-4"></div>

    <form id="formCorrecao">
      <div id="perguntasContainer"></div>
      <div class="text-end mt-4">
        <button type="submit" class="btn btn-success">Finalizar Correção</button>
      </div>
    </form>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const provaId = urlParams.get("id");
    // Se quiser manter o alunoId, precisa garantir que venha na URL e tratar a ausência, ou remover

    if (!provaId) {
      Swal.fire('Erro', 'ID da prova não fornecido.', 'error');
      return;
    }

    carregarDados(provaId);
  });

  async function carregarDados(provaId) {
  try {
    console.log('Buscando prova com ID:', provaId);
    const respProva = await fetch(`https://localhost:7141/BuscarProva?Id=${provaId}`);

    console.log('Status da resposta:', respProva.status);

    if (!respProva.ok) {
      const textoErro = await respProva.text();
      console.error('Erro na resposta da API:', textoErro);
      throw new Error('Erro ao buscar prova: ' + respProva.status);
    }

    const prova = await respProva.json();
    console.log('Prova carregada:', prova);

    mostrarProva(prova);
    mostrarPerguntas(prova, [], []);

  } catch (err) {
    console.error('Erro ao carregar dados:', err);
    Swal.fire('Erro', 'Falha ao carregar dados.', 'error');
  }
}

  function mostrarProva(prova) {
    document.getElementById("provaInfo").innerHTML = `
      <h4>${prova.titulo}</h4>
      <p><strong>Data de Registro:</strong> ${new Date(prova.dataHoraRegistro).toLocaleString('pt-BR')}</p>
    `;
  }

  function mostrarPerguntas(prova, respostasDiscursivas, respostasObjetivas) {
    const container = document.getElementById("perguntasContainer");
    container.innerHTML = "";

    // Como não temos respostas, só mostramos as perguntas e o campo para nota

    prova.perguntas.forEach((pergunta, index) => {
      let campoNota = `
        <div class="form-group mt-2">
          <label for="nota-${index}">Nota</label>
          <input type="number" class="form-control" id="nota-${index}" name="nota-${index}" min="0" max="10" step="0.5">
        </div>
      `;

      if (pergunta.tipo === 'objetiva') {
        container.insertAdjacentHTML('beforeend', `
          <div class="card mb-3">
            <div class="card-header"><strong>Pergunta ${index + 1} (Objetiva)</strong></div>
            <div class="card-body">
              <p><strong>Enunciado:</strong> ${pergunta.titulo}</p>
              <ul>
                <li><strong>A:</strong> ${pergunta.opcaoA}</li>
                <li><strong>B:</strong> ${pergunta.opcaoB}</li>
                <li><strong>C:</strong> ${pergunta.opcaoC}</li>
                <li><strong>D:</strong> ${pergunta.opcaoD}</li>
              </ul>
              <p><strong>Resposta Correta:</strong> ${pergunta.respostaCorreta}</p>
              ${campoNota}
            </div>
          </div>
        `);
      } else if (pergunta.tipo === 'discursiva') {
        container.insertAdjacentHTML('beforeend', `
          <div class="card mb-3">
            <div class="card-header"><strong>Pergunta ${index + 1} (Discursiva)</strong></div>
            <div class="card-body">
              <p><strong>Enunciado:</strong> ${pergunta.titulo}</p>
              ${campoNota}
            </div>
          </div>
        `);
      }
    });
  }

  document.getElementById("formCorrecao").addEventListener("submit", (e) => {
    e.preventDefault();
    // Implementar o envio das notas
    Swal.fire('Sucesso', 'Correção salva (simulado).', 'success');
  });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
