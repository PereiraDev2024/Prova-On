<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início - Prova Finalizada</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow text-center">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">Prova Finalizada</h4>
      </div>
      <div class="card-body">
        <h5 class="card-title">Parabéns, sua prova foi concluída com sucesso!</h5>
        <p class="card-text mt-3">Agradecemos por sua participação.</p>

        <!-- Aqui você pode mostrar dados do aluno, se quiser -->
        <div id="dadosAluno" class="my-4 d-none">
          <h6>Seus dados:</h6>
          <p><strong>Nome:</strong> <span id="alunoNome"></span></p>
          <p><strong>Data de Nascimento:</strong> <span id="alunoNascimento"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>

  <script>
    // Simulação de dados do aluno vindos de localStorage (ou sessão)
    const nome = localStorage.getItem('alunoNome');
    const nascimento = localStorage.getItem('alunoNascimento');

    if (nome && nascimento) {
      document.getElementById('dadosAluno').classList.remove('d-none');
      document.getElementById('alunoNome').textContent = nome;
      document.getElementById('alunoNascimento').textContent = nascimento;
    }

    // Mensagem opcional (pode ser removida se quiser)
    Swal.fire({
      icon: 'success',
      title: 'Prova finalizada!',
      text: 'Seus dados foram salvos com sucesso.'
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
